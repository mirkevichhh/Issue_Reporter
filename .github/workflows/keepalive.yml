name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */6 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -f -sS "${{ secrets.SUPABASE_URL }}/rest/v1/issues?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"